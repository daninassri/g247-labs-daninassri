<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SaborCasero — Recetas</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="site-header">
    <h1>SaborCasero</h1>
    <nav>
      <ul>
        <li><a href="#listado">Recetas</a></li>
        <li><a href="#nueva">Nueva receta</a></li>
      </ul>
    </nav>
  </header>

  <main class="layout">

    <section id="listado" class="panel">
      <h2>Recetas</h2>

      <form id="filters" class="filters">
        <div class="filter">
          <label for="search">Buscar</label>
          <input type="search" id="search" placeholder="Nombre de la receta">
        </div>
        <div class="filter">
          <label for="filterCategory">Categoría</label>
          <select id="filterCategory">
            <option value="">Todas</option>
            <option value="entrante">Entrante</option>
            <option value="principal">Plato principal</option>
            <option value="postre">Postre</option>
            <option value="vegetariano">Vegetariano</option>
            <option value="rapida">Rápida</option>
          </select>
        </div>
        <div class="filter filter-check">
          <input type="checkbox" id="filterFavorite">
          <label for="filterFavorite">Solo favoritas</label>
        </div>
      </form>

      <p id="loading" class="loading" role="status" hidden>Cargando…</p>
      <p id="status" class="status" role="status"></p>
      <ul id="recipeList" class="recipe-list"></ul>
    </section>

    <section id="nueva" class="panel">
      <h2 id="formTitle">Nueva receta</h2>

      <form id="recipeForm" novalidate>
        <div class="field">
          <label for="title">Título</label>
          <input type="text" id="title" name="title" autocomplete="off">
          <p class="field-error" id="error-title"></p>
        </div>

        <div class="field">
          <label for="minutes">Minutos</label>
          <input type="number" id="minutes" name="minutes" min="1" max="600">
          <p class="field-error" id="error-minutes"></p>
        </div>

        <div class="field">
          <label for="category">Categoría</label>
          <select id="category" name="category">
            <option value="">Elige una categoría</option>
            <option value="entrante">Entrante</option>
            <option value="principal">Plato principal</option>
            <option value="postre">Postre</option>
            <option value="vegetariano">Vegetariano</option>
            <option value="rapida">Rápida</option>
          </select>
          <p class="field-error" id="error-category"></p>
        </div>

        <div class="field field-check">
          <input type="checkbox" id="favorite" name="favorite">
          <label for="favorite">Marcar como favorita</label>
        </div>
        <p class="field-error" id="error-favorite"></p>

        <p class="form-message" id="formMessage" role="status"></p>

        <div class="form-actions">
          <button type="submit" id="submitBtn">Guardar receta</button>
          <button type="button" id="cancelBtn" hidden>Cancelar edición</button>
        </div>
      </form>
    </section>

  </main>

  <footer class="site-footer">
    <p>&copy; 2026 SaborCasero — Práctica 1 de Programación de Aplicaciones Web (G247).</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
